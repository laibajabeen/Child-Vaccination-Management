<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccination Management System - Login/Signup</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
    <div>
    </div>
    <div class="container">
        <div class="form-container sign-up-container">
            <form id="signupForm" action="#" method="POST">
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#"><i>f</i></a>
                    <a href="#"><i>G</i></a>
                    <a href="#"><i>in</i></a>
                </div>
                <div class="divider">or use your email for registration</div>
                <input type="text" name="name" placeholder="Name" class="form-control" required/>
                <input type="email" name="email" placeholder="Email" class="form-control" required/>
                <input type="password" name="password" placeholder="Password" class="form-control" required/>
                <div id="signupMessage" class="message"></div>
                <button type="submit">Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form id="loginForm" action="#" method="POST">
                <h1>Welcome Back!</h1>
                <div class="social-container">
                    <a href="#"><i>f</i></a>
                    <a href="#"><i>G</i></a>
                    <a href="#"><i>in</i></a>
                </div>
                <div class="divider">or use your account</div>
                <input type="email" name="email" placeholder="Email" class="form-control" required/>
                <input type="password" name="password" placeholder="Password" class="form-control" required/>
                <div id="loginMessage" class="message"></div>
                <button type="submit">Sign In</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.querySelector('.container');
 
        signUpButton.addEventListener('click', () => {
            container.classList.add('right-panel-active');
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove('right-panel-active');
        });

        // Form submission handlers
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const messageDiv = document.getElementById('loginMessage');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: formData.get('email'),
                        password: formData.get('password')
                    })
                });

                const data = await response.json();
                messageDiv.style.display = 'block';
                
                if (!response.ok) {
                    messageDiv.className = 'message error-message';
                    messageDiv.textContent = data.error;
                } else {
                    messageDiv.className = 'message success-message';
                    messageDiv.textContent = data.message;
                    // Redirect to dashboard or home page after successful login
                    setTimeout(() => {
                        window.location.href = '/dashboard'; // Adjust the redirect URL as needed
                    }, 1500);
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error-message';
                messageDiv.textContent = 'An error occurred. Please try again.';
            }
        });
        

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const messageDiv = document.getElementById('signupMessage');
            
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: formData.get('name'),
                        email: formData.get('email'),
                        password: formData.get('password')
                    })
                });

                const data = await response.json();
                messageDiv.style.display = 'block';
                
                if (!response.ok) {
                    messageDiv.className = 'message error-message';
                    messageDiv.textContent = data.error;
                } else {
                    messageDiv.className = 'message success-message';
                    messageDiv.textContent = data.message;
                    // Optional: Switch to login form after successful signup
                    setTimeout(() => {
                        container.classList.remove('right-panel-active');
                    }, 1500);
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error-message';
                messageDiv.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
