<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VacciTrack - Child Vaccination</title>
    <link href="parent.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Child Vaccination Registration</h1>
            
            <form id="childRegistrationForm">
                <!-- Child Details -->
                <div class="form-group">
                    <label for="childName">Child's Full Name</label>
                    <input type="text" id="childName" placeholder="Child's Full Name" required>
                </div>
                
                <div class="form-grid">
                    <input type="date" id="childDOB" required>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Available Vaccines -->
                <div class="form-group">
                    <label>Available Vaccines</label>
                    <div id="vaccineList">
                        <div class="checkbox-group">
                            <input type="checkbox" id="bcg" name="vaccine" value="BCG">
                            <label for="bcg">BCG Vaccine</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="polio" name="vaccine" value="Polio">
                            <label for="polio">Polio Vaccine</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="mmr" name="vaccine" value="MMR">
                            <label for="mmr">MMR Vaccine</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="hepatitisB" name="vaccine" value="Hepatitis B">
                            <label for="hepatitisB">Hepatitis B Vaccine</label>
                        </div>
                    </div>
                </div>

                <!-- Parent Email Input -->
                <div class="form-group">
                    <label for="parentEmail">Parent Email</label>
                    <input type="email" id="parentEmail" placeholder="Parent's Email Address" required>
                </div>

                <button type="submit">Register Child</button>
            </form>

            <!-- Records Section -->
            <div class="records-section">
                <h2>Vaccination Records</h2>
                <div id="vaccinationRecords">
                    <!-- Records will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script >
        // Form submission logic
document.getElementById('childRegistrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const parentEmail = document.getElementById('parentEmail').value;
    const childName = document.getElementById('childName').value;
    const dateOfBirth = document.getElementById('childDOB').value;
    const gender = document.getElementById('gender').value;
    
    const selectedVaccines = Array.from(
        document.querySelectorAll('input[name="vaccine"]:checked')
    ).map(el => el.value);

    if (selectedVaccines.length === 0) {
        alert('Please select at least one vaccine');
        return;
    }

    const childData = {
        childName,
        dateOfBirth,
        gender,
        vaccines: selectedVaccines,
        parentEmail
    };

    try {
        const response = await fetch('/register-vaccination', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(childData)
        });

        if (!response.ok) {
            throw new Error('Registration failed');
        }

        const result = await response.json();
        alert('Child registered successfully!');
        loadVaccinationRecords();
        this.reset();
    } catch (error) {
        alert('Error registering child: ' + error.message);
    }
});

// Load vaccination records
async function loadVaccinationRecords() {
    try {
        const response = await fetch(`/vaccination-records/${document.getElementById('parentEmail').value}`);
        const records = await response.json();
        
        const recordsContainer = document.getElementById('vaccinationRecords');
        recordsContainer.innerHTML = records.map(record => `
            <div class="record-card">
                <h3>${record.childName}</h3>
                <p>Date of Birth: ${new Date(record.dateOfBirth).toLocaleDateString()}</p>
                <p>Gender: ${record.gender}</p>
                <p>Vaccines: ${record.vaccines.map(v => v.name).join(', ')}</p>
                <p class="timestamp">Registered on: ${new Date(record.createdAt).toLocaleDateString()}</p>
            </div>
        `).join('');
    } catch (error) {
        console.error('Error loading records:', error);
    }
}
    </script>
</body>
</html>
